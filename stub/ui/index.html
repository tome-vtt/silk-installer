<!doctype html>
<!-- Silk Setup's default theme, used when the config names no theme. One file, window.silk only
     (docs/theme-api.md); a good starting point for your own. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup</title>
<style>
  :root {
    --page: #fbfbfc;
    --panel: #f1f3f7;
    --line: #dde1e8;
    --ink: #151821;
    --dim: #5a6072;
    --accent: #2563eb;
    --accent-2: #1e40af;
    --accent-ink: #ffffff;
    --accent-soft: rgba(37, 99, 235, 0.12);
    --danger: #b42318;
    --body: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI Semibold", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #14161b;
      --panel: #1a1d24;
      --line: #2a2f3a;
      --ink: #e9ecf2;
      --dim: #9aa2b4;
      --accent: #6ea8ff;
      --accent-2: #3b6fd8;
      --accent-ink: #0b0d12;
      --accent-soft: rgba(110, 168, 255, 0.16);
      --danger: #ff8a7a;
    }
  }

  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 14px/1.5 var(--body);
    display: flex;
    flex-direction: column;
  }
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 220px 1fr; }

  /* Only with frame = false in the config: the title bar Windows would otherwise draw. */
  .titlebar {
    display: flex;
    align-items: center;
    height: 32px;
    padding-left: 12px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--dim);
    user-select: none;
  }
  .titlebar[hidden] { display: none; }
  .titlebar span { flex: 1; }
  .titlebar button { width: 46px; height: 32px; padding: 0; border: 0; border-radius: 0; color: var(--ink); transform: none; }
  .titlebar button.close:hover { background: #c42b1c; color: #fff; }
  .titlebar svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; }

  .brand {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .brand::before {
    content: "";
    position: absolute;
    inset: 50% auto auto 50%;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-soft), transparent 70%);
    transform: translate(-50%, -62%);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  body[data-step="installing"] .brand::before { opacity: 1; }
  .mark {
    position: relative;
    width: 84px;
    height: 84px;
    border-radius: 22px;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    color: #fff;
    font: 600 40px/1 var(--display);
    box-shadow: 0 12px 30px -12px var(--accent);
  }
  body[data-step="installing"] .mark { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.04); } }
  .brand b { position: relative; font: 600 16px/1.3 var(--display); overflow-wrap: anywhere; }
  .brand small { position: relative; display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }

  main { padding: 32px 32px 24px; display: flex; min-width: 0; }
  .step { display: flex; flex-direction: column; gap: 16px; flex: 1; min-width: 0; }
  .step[hidden] { display: none; }
  .step:not([hidden]) { animation: enter 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes enter { from { opacity: 0.4; transform: translateY(6px); } }
  h1 { font: 600 26px/1.15 var(--display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
  p { margin: 0; color: var(--dim); max-width: 46ch; }

  .where {
    display: grid;
    gap: 4px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12px;
    color: var(--dim);
  }
  .where code { font: 12.5px/1.4 var(--mono); color: var(--ink); overflow-wrap: anywhere; }

  .actions { margin-top: auto; display: flex; justify-content: flex-end; gap: 10px; }
  button {
    font: 600 14px/1 var(--body);
    padding: 11px 20px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  button:hover { background: var(--panel); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: default; transform: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); min-width: 110px; }
  button.primary:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .meter { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
  /* No width transition: progress arrives once per file, often hundreds a second, and a transition that
     restarts on every event never catches up, so the bar trailed the percentage. */
  .meter span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; }
  .status { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--dim); }
  .status b { font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
  .file { font: 12px/1.6 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eta { font-size: 13px; min-height: 1.5em; }

  .tick {
    width: 44px; height: 44px; padding: 10px; box-sizing: border-box; border-radius: 50%;
    background: var(--accent-soft); fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .error h1 { color: var(--danger); }
  .error p { color: var(--ink); overflow-wrap: anywhere; }

  @media (prefers-reduced-motion: reduce) {
    .step:not([hidden]), body[data-step="installing"] .mark { animation: none; }
  }
</style>
</head>
<body data-step="welcome">

<header class="titlebar" data-silk-drag hidden>
  <span id="window-title"></span>
  <button data-go="minimize" aria-label="Minimise"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
  <button class="close" data-go="close" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
</header>

<div class="app">
<aside class="brand">
  <div class="mark" id="mark" aria-hidden="true"></div>
  <div><b id="brand-name"></b><small id="brand-version"></small></div>
</aside>

<main>
  <section class="step" data-step="welcome">
    <h1 id="welcome-title"></h1>
    <p id="welcome-body"></p>
    <div class="where">
      <span id="where">Installs for you only, no admin prompt</span>
      <code id="target"></code>
    </div>
    <div class="actions">
      <button data-go="quit">Cancel</button>
      <button class="primary" data-go="install" id="install"></button>
    </div>
  </section>

  <section class="step" data-step="installing" hidden>
    <h1 id="installing-title"></h1>
    <p id="phase">Getting ready</p>
    <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><span id="bar"></span></div>
    <div class="status"><span class="file" id="file"></span><b id="pct">0%</b></div>
    <p class="eta" id="eta"></p>
    <div class="actions">
      <button data-go="cancel" id="cancel">Cancel</button>
    </div>
  </section>

  <section class="step" data-step="done" hidden>
    <svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4L18 8"/></svg>
    <h1 id="done-title"></h1>
    <p id="done-body"></p>
    <div class="actions">
      <button data-go="quit" id="close">Close</button>
      <button class="primary" data-go="launch" id="launch"></button>
    </div>
  </section>

  <section class="step error" data-step="error" hidden>
    <h1 id="error-title"></h1>
    <p id="error-message"></p>
    <div class="actions">
      <button data-go="quit">Close</button>
      <button class="primary" data-go="install">Try again</button>
    </div>
  </section>

  <section class="step" data-step="cancelled" hidden>
    <h1>Setup cancelled</h1>
    <p>Nothing was changed. Run setup again whenever you are ready.</p>
    <div class="actions">
      <button class="primary" data-go="quit">Close</button>
    </div>
  </section>
</main>
</div>

<script>
  const info = silk.info;
  const $ = (id) => document.getElementById(id);
  const text = (id, s) => { $(id).textContent = s; };
  const mb = (bytes) => `${Math.max(1, Math.round(bytes / 1048576))} MB`;

  function show(step) {
    document.body.dataset.step = step;
    for (const s of document.querySelectorAll(".step")) s.hidden = s.dataset.step !== step;
    document.querySelector(`[data-step="${step}"] .primary`)?.focus();
  }

  // Welcome: a fresh install, an update, the same version again, or (run from Installed Apps) removal.
  const uninstall = info.mode === "uninstall";
  $("window-title").textContent = uninstall ? `Uninstall ${info.product}` : `${info.product} Setup`;
  $("window-title").parentElement.hidden = info.frame;
  text("mark", info.product.trim().charAt(0).toUpperCase());
  text("brand-name", info.product);
  text("brand-version", `Version ${info.version}`);
  text("target", info.target);
  if (uninstall) {
    text("brand-version", `Version ${info.installed ?? info.version}`);
    text("welcome-title", `Remove ${info.product}?`);
    text("welcome-body", `Removes ${info.product}, its shortcuts and its entry in Installed apps from this PC.`);
    text("where", "Installed in");
    text("install", "Remove");
  } else if (info.alreadyCurrent) {
    text("welcome-title", `${info.product} ${info.installed} is already installed`);
    text("welcome-body", "You can install it again if something is not working.");
    text("install", "Reinstall");
  } else if (info.installed) {
    text("welcome-title", `Update ${info.product}`);
    text("welcome-body", `Updates version ${info.installed} to ${info.version}. ${info.product} closes while it updates.`);
    text("install", "Update");
  } else {
    text("welcome-title", `Install ${info.product}`);
    text("welcome-body", `${info.product} ${info.version} from ${info.publisher}, ${mb(info.size)} on disk.`);
    text("install", "Install");
  }
  text("installing-title", `${uninstall ? "Removing" : "Installing"} ${info.product}`);
  text("done-title", `${info.product} ${uninstall ? "was removed" : "is installed"}`);
  text("done-body", uninstall ? `${info.product} is no longer on this PC.` : `${info.product} ${info.version} is ready to use.`);
  text("error-title", `${info.product} could not ${uninstall ? "be removed" : "install"}`);
  text("launch", `Launch ${info.product}`);
  // An uninstall cannot be cancelled once it starts (the confirm screen is the way out).
  $("cancel").hidden = uninstall;
  if (!info.launchAtFinish || uninstall) {
    $("launch").hidden = true;
    $("close").classList.add("primary");
  }

  // Installing: phase, bar, last file and, once it has a rate to go on, the time left.
  const phases = { preparing: "Getting ready", copying: "Copying files", removing: "Removing files", finishing: "Finishing up" };
  let started = 0;
  function eta(p) {
    if (p.phase === "finishing") return "Almost done";
    const elapsed = (performance.now() - started) / 1000;
    if (!p.bytesDone || elapsed < 1.5) return "";
    const left = ((p.bytesTotal - p.bytesDone) * elapsed) / p.bytesDone;
    if (left < 10) return "A few seconds left";
    if (left < 60) return `About ${Math.round(left / 5) * 5} seconds left`;
    const min = Math.round(left / 60);
    return `About ${min} minute${min === 1 ? "" : "s"} left`;
  }
  silk.on("progress", (p) => {
    const n = Math.floor(p.percent);
    $("bar").style.width = `${n}%`;
    text("pct", `${n}%`);
    $("meter").setAttribute("aria-valuenow", String(n));
    text("phase", phases[p.phase] ?? p.phase);
    if (p.file) text("file", p.file);
    text("eta", eta(p));
    $("cancel").disabled = p.phase === "finishing";
  });
  // Closing from our own title bar mid-install cancels first, so nothing is left half-copied.
  let quitWhenStopped = false;
  silk.on("finish", () => (quitWhenStopped ? silk.quit() : show("done")));
  silk.on("error", (e) => {
    if (quitWhenStopped) return silk.quit();
    if (e.cancelled) return show("cancelled");
    text("error-message", e.message);
    show("error");
  });

  const actions = {
    install() {
      started = performance.now();
      $("bar").style.width = "0";
      text("pct", "0%"); text("file", ""); text("eta", ""); text("phase", phases.preparing);
      $("cancel").disabled = false;
      show("installing");
      silk.start().catch(() => {}); // the error event shows it
    },
    cancel() {
      $("cancel").disabled = true;
      silk.cancel();
    },
    launch() {
      silk.launch().then(silk.quit, (e) => { text("done-body", `Could not start ${info.product}: ${e.message}`); });
    },
    quit: () => silk.quit(),
    minimize: () => silk.window.minimize(),
    close() {
      if (document.body.dataset.step !== "installing") return silk.quit();
      quitWhenStopped = true;
      silk.cancel();
    },
  };
  document.addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]")?.dataset.go;
    if (go) actions[go]();
  });
  show("welcome");
</script>
</body>
</html>
