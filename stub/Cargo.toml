[package]
name = "silk-stub"
version = "0.2.1"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: serve the embedded ui/ in every build; without it Tauri runs in dev mode.
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
# Both already come with tauri: the API's info as JSON, and decoding theme URLs.
serde_json = "1"
percent-encoding = "2"
silk-archive = { path = "../archive" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_RemoteDesktop", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
