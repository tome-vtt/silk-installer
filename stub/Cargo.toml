[package]
name = "silk-stub"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: serve the embedded ui/ in every build; without it Tauri runs in dev mode.
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
silk-archive = { path = "../archive" }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
