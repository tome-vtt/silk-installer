# yaml-language-server: $schema=https://raw.githubusercontent.com/tome-vtt/Spider/master/schema/silk.schema.json
# Spider drives this repository (SILK-4). Every field is Spider's docs/spec/pipeline-config.md § 3's.
# Spider reads this file from releaseBranch (main), so a change here takes effect once it reaches main.
# No `plugin` key: jobs run the plugin of whatever Spider release the control plane runs (SPIDER-S1690).
version: 1

repo:
  baseBranch: development
  releaseBranch: main
  workBranchPattern: spider/{ticket.id}
  merge:
    lander: node
    check: { gate: true, timeoutSec: 1800 }
    onConflict: { state: Needs-Revision }
    onCheckFailed: { state: Needs-Revision }
    onReverted: { state: Needs-Revision }
    onParked: { state: Needs-Triage }

# Off Linear, onto Spider's own tracker. Imported tickets keep their SILK-<n> ids; new ones are
# SILK-S<n>-T<m>.
tracker:
  type: spider
  prefix: SILK
  states:
    Asked: waiting
    Hand-Step: waiting
    Review-Limit: waiting
    Stuck: waiting
    Landed: done
    Split: done
    Already-Done: done
    Wont-Do: dropped
    Duplicate: dropped
    Superseded: dropped

defaults:
  maxTurns: 150
  maxRuntimeMin: 90
  maxRejections: 4
  # Every stage needs a Windows node: the stub and the compiler call Win32 directly, and silk-archive's
  # path checks follow Windows path rules. `cargo` is a node's own --capabilities entry (setup-node.ts);
  # `windows` it advertises by itself.
  requires:
    features: [windows, cargo]

prepare:
  - files: ["Cargo.lock"]
    cmd: cargo fetch --locked
    cwd: .

# Keeps the build cache between jobs; a cold Tauri build is most of a job's test time.
preserve:
  - target/

cleanup:
  locks: [tests, merge]

gate:
  - name: tests
    paths: ["**"]
    run:
      - cargo test --workspace --locked
      - node --test scripts/api.test.mjs
  # Formatting (rustfmt.toml); `rustup component add` is a no-op once a node has rustfmt.
  - name: fmt
    paths: ["**/*.rs", "rustfmt.toml"]
    run:
      - rustup component add rustfmt
      - cargo fmt --all --check
  # The function complexity and nesting caps (AGENTS.md); `rustup component add` is a no-op once a
  # node has clippy.
  - name: complexity
    paths: ["**/*.rs", "**/Cargo.toml", "clippy.toml", "complexity-baseline.json", "scripts/**"]
    run:
      - rustup component add clippy
      - node --test scripts/complexity.test.mjs
      - node scripts/complexity.mjs
  # Every other clippy lint, warnings denied (AGENTS.md). cognitive_complexity is allowed here because
  # complexity.mjs above owns it and its baseline.
  - name: clippy
    paths: ["**/*.rs", "**/Cargo.toml", "Cargo.lock", "clippy.toml"]
    run:
      - rustup component add clippy
      - cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::cognitive_complexity
  # The cognitive complexity cap (AGENTS.md), with the pinned tool; `cargo install` is a no-op once a
  # node has that version.
  - name: cognitive
    paths: ["**/*.rs", "cognitive-baseline.json", "scripts/**"]
    run:
      - cargo install rust-code-analysis-cli --version 0.0.25 --locked
      - node --test scripts/cognitive.test.mjs
      - node scripts/cognitive.mjs
  # Advisories and licences of the dependency tree every installer redistributes (deny.toml). The
  # pinned `cargo install` builds cargo-deny once per node, then is a no-op.
  - name: deny
    paths: ["Cargo.lock", "**/Cargo.toml", "deny.toml"]
    run:
      - cargo install cargo-deny --version 0.20.2 --locked
      - cargo deny --locked check

  # CI's workflows job: actionlint 1.7.12 and zizmor 1.30.1. CI's actionlint image brings its own
  # shellcheck; only the gate pins shellcheck 0.11.0. The script fetches checksum-pinned copies of
  # all three into a per-node cache on first use, so nodes need none of them. zizmor runs offline
  # here (no token), so CI alone makes its network audits.
  - name: workflows
    paths: [".github/**", "scripts/workflow-lint*", "scripts/workflow-lint/**"]
    run:
      - node --test scripts/workflow-lint.test.mjs
      - node scripts/workflow-lint.mjs

testLock:
  commands:
    - 'cargo\s+test\b'

stages:
  - name: revision
    queue: { state: Needs-Revision }
    whileRunning: In-Revision
    prompt: |
      /spider:revision {ticket.id}

      The ticket:
      {ticket.body}

      The findings from the review that sent this back:
      {prior.summary}

      Every rejection since this ticket was last parked:
      {prior.reviews}
    maxTurns: 200
    maxRuntimeMin: 120
    merges: true
    on:
      done:
        pass: { state: Needs-Review }
      parked: { state: Needs-Triage }
      nothing_to_do: { state: Needs-Triage }
      stage_error: { state: Needs-Triage }

  - name: review
    queue: { state: Needs-Review }
    whileRunning: In-Review
    prompt: |
      /spider:review {ticket.id}

      The ticket:
      {ticket.body}

      The prior stage's self-review:
      {prior.summary}

      The range of the ticket's newest landing:
      {prior.range}

      This stage's own rejections since the ticket was last parked: {loop.rejections}, of a cap of
      {loop.cap}.
    maxTurns: 100
    maxRuntimeMin: 45
    on:
      done:
        pass: { state: Landed }
        changes_requested: { state: Needs-Revision }
      parked: { state: Needs-Triage }
      nothing_to_do: { state: Needs-Triage }
      stage_error: { state: Needs-Triage }

  - name: build
    queue: { state: Needs-Build }
    whileRunning: In-Build
    prompt: |
      /spider:build {ticket.id}

      The ticket:
      {ticket.body}
    maxTurns: 350
    maxRuntimeMin: 180
    merges: true
    on:
      done:
        pass: { state: Needs-Review }
      parked: { state: Needs-Triage }
      nothing_to_do: { state: Needs-Triage }
      stage_error: { state: Needs-Triage }

  # Needs-Triage's own consumer, as in Spider's silk.yml. Its escape hatches go to a waiting state,
  # not back to Needs-Triage, so a ticket triage can't decide on doesn't loop.
  - name: triage
    queue: { state: Needs-Triage }
    whileRunning: In-Triage
    prompt: |
      /spider:triage {ticket.id}

      The ticket:
      {ticket.body}

      This ticket's own lines from the control plane's log:
      {ticket.log}
    maxTurns: 100
    maxRuntimeMin: 45
    on:
      done:
        retry_build: { state: Needs-Build }
        retry_revision: { state: Needs-Revision }
        finish: { state: Landed }
        split: { state: Split }
        cancel: { state: Duplicate }
        person: { state: Stuck }
      parked: { state: Stuck }
      nothing_to_do: { state: Stuck }
      stage_error: { state: Stuck }
