# The smallest per-machine config: installs for all users of the PC and asks for administrator rights
# (UAC) when started. The target defaults to '{programfiles}\{product}'; the Installed Apps entry goes
# under HKLM and the shortcuts into the all-users Start menu.
product = "Sample"
version = "1.0.0"
publisher = "Sample Co"
scope = "machine"
main_exe = "sample.exe"
payload = "payload"

# An inbound Windows Firewall rule, added on install (replacing any rule of the same name) and removed on
# uninstall; per-machine only. name, protocol ("tcp" or "udp") and profiles (any of "domain", "private",
# "public") are required, with ports (1-65535), program, or both. program may hold {target}; with ports
# too, only that exe may listen on them.
# [[firewall]]
# name = "Sample server"
# ports = [7317, 7318]
# protocol = "tcp"
# profiles = ["private"]
# program = '{target}\sample.exe'
