# Spider's installer as a Silk config, as it would sit at Spider's installer/spider.toml.
# Build it with: silk build installer/spider.toml
# A release stamps its tag's version without editing this file: silk build installer/spider.toml --version 1.4.2
# Relative paths resolve from this file's folder.

product = "Spider"              # names the install folder, shortcut, Installed Apps entry and uninstaller
version = "0.1.0"               # dotted numbers; compared on upgrade and shown in Installed Apps; `silk build --version` overrides it
publisher = "Tome Gaming"
icon = "src-tauri/icons/icon.ico"   # optional; becomes the setup exe's icon
scope = "user"                  # the default: no UAC, HKCU; "machine" installs for all users (examples/machine.toml)
target = '{localappdata}\Programs\{product}'   # default install folder; placeholders {localappdata} (per-user), {programfiles} (per-machine), {product}
main_exe = "Spider.exe"         # relative to the payload; closed before upgrade, launched at finish
payload = "../desktop/release/win-unpacked"
theme = "theme"                 # optional; a folder holding index.html (docs/theme-api.md); none: the built-in default theme
close_running = true            # default: stop main_exe before replacing the files
launch_at_finish = true         # default: start main_exe when done
webview2_bootstrapper = false   # default; true packs Microsoft's WebView2 bootstrapper (about 1.8 MB) to install WebView2 where it is missing

[window]                        # default 720 x 460 with the native title bar; never resizable
width = 720
height = 460
frame = true                    # false: no native title bar or border; the theme draws its own
minimize = true                 # false: no native minimise button (only with frame = true)
close = true                    # false: native close button disabled (only with frame = true)

[shortcuts]                     # defaults: Start menu yes, desktop no
start_menu = true
desktop = false

# The login item Spider's shell writes itself, removed on uninstall. Electron names it after the app's
# AppUserModelId, com.tomegaming.spider. spider-desktop is an older name kept in case an install still
# has it; a value that is not there is skipped. Keys under HKCU\; a per-machine config may also name
# HKLM\ keys.
[[remove_registry_value]]
key = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run'
name = "com.tomegaming.spider"

[[remove_registry_value]]
key = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run'
name = "spider-desktop"

# Spider runs no extra programs. A [[run]] entry looks like:
# [[run]]
# program = '{target}\resources\helper.exe'   # {target} is the install folder
# args = ["--register"]
# at = "after-install"          # or "before-uninstall", or "before-install" (README)
# fail_on_nonzero = true        # the default
# talk = false                  # true: the theme reads its stdout and writes its stdin (docs/theme-api.md)

# Signing (optional): run on the uninstaller silk packs, then on the finished installer, so both are
# signed and the signature covers the packed files. {file} is the absolute path of the file to sign;
# the command runs from this file's folder. Skip it for a local test build with `silk build --no-sign`. Spider's release uses Azure Trusted Signing: the
# workflow logs in to Azure and installs the TrustedSigning module first, as release-desktop.yml does.
# [sign]
# command = "pwsh"
# args = ["-NoProfile", "-NonInteractive", "-Command", '''Invoke-TrustedSigning -Endpoint $env:AZURE_CODESIGNING_ENDPOINT -CodeSigningAccountName $env:AZURE_CODESIGNING_ACCOUNT -CertificateProfileName $env:AZURE_CODESIGNING_PROFILE -Files '{file}' -FileDigest SHA256 -TimestampRfc3161 http://timestamp.acs.microsoft.com -TimestampDigest SHA256''']
# With a certificate file instead: command = "signtool",
# args = ["sign", "/fd", "SHA256", "/f", "cert.pfx", "/tr", "http://timestamp.digicert.com", "/td", "SHA256", "{file}"]
