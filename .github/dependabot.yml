# Security updates only. Per Bart's decision of 2026-10-15, Spider's weekly catch-up ticket moves
# package and Actions pins, so Dependabot opens no version-update pull requests:
# open-pull-requests-limit: 0 stops those and leaves security alerts and security-update pull
# requests working. Updates that do open target development (AGENTS.md: main moves only from it).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: development
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
