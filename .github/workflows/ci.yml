# Windows only: silk-archive compiles on Linux, but its path checks follow Windows path rules
# (drive letters, backslashes), so its tests only pass on Windows.
name: ci

on:
  push:
    branches: [development, main]
  # No check covers docs/ (AGENTS.md), so a docs-only pull request runs nothing (SILK-S94-T1).
  pull_request:
    paths-ignore: ["docs/**"]

permissions:
  contents: read

# A fork pull request runs on GitHub-hosted runners, never the self-hosted SPIDER_* ones (SILK-S82-T1).
# A fork's pull request runs its own copy of this file, so the repository's runner-group and
# fork-approval settings must also keep outside code off the self-hosted runners.
jobs:
  windows:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'windows-latest' || vars.SPIDER_WINDOWS_RUNNER || 'windows-latest' }}
    needs: reuse
    # A tree its green pull request head already passed runs nothing again (SILK-S95-T1).
    if: ${{ !cancelled() && needs.reuse.outputs.passed != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: node --test scripts/api.test.mjs
      - run: node --test scripts/workflow-lint.test.mjs
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::cognitive_complexity
      - run: node --test scripts/complexity.test.mjs
      - run: node scripts/complexity.mjs
      # Cognitive complexity cap of 15 (SILK-S4-T3).
      - run: cargo install rust-code-analysis-cli --version 0.0.25 --locked
      - run: node --test scripts/cognitive.test.mjs
      - run: node scripts/cognitive.mjs

  # cargo-deny: advisories and licences (SILK-S8-T2, SILK-S9-T1).
  deny:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'windows-latest' || vars.SPIDER_WINDOWS_RUNNER || 'windows-latest' }}
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.passed != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check

  # The workflows and dependabot.yml: actionlint, then zizmor's security audits.
  workflows:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.SPIDER_LINUX_RUNNER || 'ubuntu-latest' }}
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.passed != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      # zizmor-action fetches its hash-pinned wheel with `python3 -m pip`, which the self-hosted
      # runners' system Python lacks (SILK-S79-T1).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.9'
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.30.1
          advanced-security: false

  # On a push to main: did the merged pull request's head, with this same tree, pass ci? Skipped on
  # any other event, so the jobs above run there as before (SILK-S95-T1).
  reuse:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.SPIDER_LINUX_RUNNER || 'ubuntu-latest' }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The merged pull request into main whose merge commit is this push.
          head=$(gh api "repos/$REPO/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=30" \
            --jq "[.[] | select(.merge_commit_sha == \"$SHA\") | .head.sha][0] // empty")
          tree() { gh api "repos/$REPO/git/commits/$1" --jq .tree.sha; }
          passed=false
          if [ -n "$head" ] && [ "$(tree "$SHA")" = "$(tree "$head")" ]; then
            conclusion=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&per_page=1" \
              --jq '.workflow_runs[0].conclusion // empty')
            [ "$conclusion" = success ] && passed=true
          fi
          echo "pull request head: ${head:-none}; passed: $passed"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
