# Windows only: silk-archive compiles on Linux, but its path checks follow Windows path rules
# (drive letters, backslashes), so its tests only pass on Windows.
name: ci

on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: node --test scripts/api.test.mjs
      - run: node --test scripts/workflow-lint.test.mjs
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::cognitive_complexity
      - run: node --test scripts/complexity.test.mjs
      - run: node scripts/complexity.mjs
      # Cognitive complexity cap of 15 (SILK-S4-T3).
      - run: cargo install rust-code-analysis-cli --version 0.0.25 --locked
      - run: node --test scripts/cognitive.test.mjs
      - run: node scripts/cognitive.mjs

  # cargo-deny: advisories and licences (SILK-S8-T2, SILK-S9-T1).
  deny:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check

  # The workflows and dependabot.yml: actionlint, then zizmor's security audits.
  workflows:
    runs-on: ${{ vars.SPIDER_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - uses: zizmorcore/zizmor-action@f9597c869b2e67095f9b527070297a13a6efe928 # v0.7.0
        with:
          version: 1.30.1
          advanced-security: false
